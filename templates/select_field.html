<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Field - Excel Data Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 50px;
        }
        .container {
            max-width: 600px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">Excel Data Analyzer</h1>
        
        <div class="card">
            <div class="card-header">
                Select Field to Analyze
            </div>
            <div class="card-body">
                <form action="/analyze" method="POST">
                    <input type="hidden" name="filename" value="{{ filename }}">
                    <div class="mb-3">
                        <label for="field" class="form-label">Choose a field from your Excel file:</label>
                        <select class="form-select" id="field" name="field" required>
                            <option value="" selected disabled>Select a field</option>
                            {% for column in columns %}
                            <option value="{{ column }}">{{ column }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Analyze</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
